# SkillHub Kubernetes 部署清单（内网 K8s + 远程 PostgreSQL）
# 用法：kubectl apply -f deploy/k8s/skillhub.yaml
# 完整说明见 docs/deployment-guide.md 第 8 节
apiVersion: v1
kind: Namespace
metadata:
  name: skillhub
---
apiVersion: v1
kind: Secret
metadata:
  name: skillhub-secrets
  namespace: skillhub
type: Opaque
stringData:
  # 远程 PostgreSQL 连接（生产建议用外部 Secret 管理，如 SealedSecret / 集群 Secret 注入）
  DB_PASSWORD: "your-strong-password"
  JWT_SECRET: "replace-with-random-64-hex"
  LLM_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillhub-config
  namespace: skillhub
data:
  # 环境标识：dev / test / prod，决定是否加载 .env.<APP_ENV>（K8s 下以这里为准）
  APP_ENV: "prod"
  # 远程 PostgreSQL 连接（集群外，按内网实际地址填写）
  DB_HOST: "pg-prod.internal.corp"
  DB_PORT: "5432"
  DB_USER: "skillhub"
  DB_NAME: "skillhub"
  # 或用 DATABASE_URL 一次性指定（优先级更高，密码放 Secret）：
  # DATABASE_URL: "postgres://skillhub:password@pg-prod.internal.corp:5432/skillhub"
  LLM_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  LLM_MODEL_NAME: "qwen-plus"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skillhub-storage
  namespace: skillhub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub
  namespace: skillhub
spec:
  replicas: 1            # 单副本即可；多副本需共享 storage（RWX/NFS）
  selector:
    matchLabels:
      app: skillhub
  template:
    metadata:
      labels:
        app: skillhub
    spec:
      containers:
        - name: skillhub
          image: harbor.internal.corp/skillhub/skillhub:latest   # 替换为内网 registry 地址
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: skillhub-config
            - secretRef:
                name: skillhub-secrets
          volumeMounts:
            - name: storage
              mountPath: /app/server/storage
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/skills
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: skillhub-storage
---
apiVersion: v1
kind: Service
metadata:
  name: skillhub
  namespace: skillhub
spec:
  selector:
    app: skillhub
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillhub
  namespace: skillhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"   # 上传 ZIP 需要
spec:
  ingressClassName: nginx
  rules:
    - host: skillhub.corp            # 内网域名，按环境替换
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillhub
                port:
                  number: 3001
